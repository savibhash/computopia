<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computopia</title>
  <!-- Google Fonts for Classic Mysterious Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <!-- Main Portal Stylesheet -->
  <link rel="stylesheet" href="/css/style.css" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='c' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='60%25' stop-color='%23e2e8f0'/%3E%3Cstop offset='100%25' stop-color='%2394a3b8'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='55%25' stop-color='%23cbd5e1'/%3E%3Cstop offset='100%25' stop-color='%2364748b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cellipse cx='32' cy='45' rx='28' ry='7' fill='%23000000' opacity='0.45'/%3E%3Cpath d='M3 41 C12 52 52 52 61 41 C54 34 46 35 32 35 C18 35 10 34 3 41 Z' fill='url(%23b)' stroke='%23ffffff' stroke-width='1'/%3E%3Cpath d='M15 38 L21 15 C22 11 27 14 32 14 C37 14 42 11 43 15 L49 38 Z' fill='url(%23c)'/%3E%3Cpath d='M22 14 C26 19 38 19 42 14 C37 16 27 16 22 14 Z' fill='%2394a3b8'/%3E%3Cpath d='M32 14 L32 38 L49 38 L43 15 C42 11 37 14 32 14 Z' fill='%23475569' opacity='0.25'/%3E%3Cpath d='M15.5 33 C26 36 38 36 48.5 33 L49 38 C38 41 26 41 15 38 Z' fill='%230f172a'/%3E%3C/svg%3E" />
  
</head>
<body>

  <!-- Background Kaleidoscope / Fractal Video -->
  <div class="video-container">
    <video autoplay muted loop playsinline class="bg-video">
      <!-- Replace "your-video.mp4" with your actual local video file name -->
      <source src="/assets/images/hack.png" type="video/mp4" />
    </video>
    <!-- Deep 3D Vignette & Atmospheric Overlay -->
    <div class="vignette-overlay"></div>
  </div>

  <!-- Subtle Arcane Corner HUD Frames -->
  <div class="hud-frame top-left">
    <span class="hud-code">SYS.PORTAL // 0x7F3A</span>
    <span class="hud-sub">DIMENSIONAL GATEWAY</span>
  </div>
  <div class="hud-frame top-right">
    <span class="hud-code">SYNC: LOCKED</span>
    <span class="hud-sub">FREQ: 432.08 Hz</span>
  </div>
  <div class="hud-frame bottom-left">
    <span class="hud-code">01000011 01010011</span>
    <span class="hud-sub">TURING MATRIX ACTIVE</span>
  </div>
  <div class="hud-frame bottom-right">
    <span class="hud-code">NODE: ORIGIN</span>
    <span class="hud-sub">AWAITING INITIATE</span>
  </div>

  <!-- Center 3D Gyroscopic Portal Assembly -->
  <main class="portal-stage" id="portalStage">
    <div class="gyroscope-3d">
      
      <!-- 3D Orbiting Gimbal Rings (X, Y, Z Axes) -->
      <div class="ring-3d ring-outer-z"></div>
      <div class="ring-3d ring-tilt-x"></div>
      <div class="ring-3d ring-tilt-y"></div>
      <div class="ring-3d ring-diagonal-1"></div>
      <div class="ring-3d ring-diagonal-2"></div>
      <div class="ring-3d ring-sacred-square"></div>
      <div class="ring-3d ring-inner-pulse"></div>

      <!-- The Center Portal Button (Zero Overflow) -->
      <a href="home.html" class="enter-btn" id="enterBtn">
        <span class="btn-sigil">❖</span>
        <span class="btn-word-small">ENTER</span>
        <span class="btn-word-main">COMPUTOPIA</span>
        <span class="btn-line"></span>
      </a>

    </div>
  </main>

  <!-- Smooth 3D Warp Transition & Mouse Parallax Script -->
  <script>
    const stage = document.getElementById('portalStage');
    const enterBtn = document.getElementById('enterBtn');

    // Subtle 3D tilt following cursor movement
    document.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 35;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 35;
      stage.style.transform = `translate(-50%, -50%) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // Portal warp animation before opening home.html
    enterBtn.addEventListener('click', (e) => {
      e.preventDefault();
      document.body.classList.add('warp-active');
      setTimeout(() => {
        window.location.href = enterBtn.getAttribute('href');
      }, 850);
    });
  </script>

</body>
</html>
